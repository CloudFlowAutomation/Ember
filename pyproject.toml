[project]
name = "websocket-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.62",
    "fastapi>=0.141.1",
    "python-socketio>=5.16.3",
    "uvicorn[standard]",
]

[project.scripts]
websocket-server = "websocket_server:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
