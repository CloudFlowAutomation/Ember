name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g npm@11.17.0
      - run: npm ci
      - run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # Windows and Linux run after macOS so the GitHub release for this tag
  # already exists before they upload their assets to it (electron-forge's
  # GitHub publisher creates the release on first upload; running all three
  # platforms concurrently risks two jobs racing to create it).
  publish-windows:
    needs: publish-macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g npm@11.17.0
      - run: npm ci
      - run: npm run publish:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-linux:
    needs: publish-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g npm@11.17.0
      - run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - run: npm ci
      - run: npm run publish:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
